
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagerstyring</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Lagerstyring</h1>
    <p>Oversikt over butikkens produkter og lagerbeholdning.</p>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Legg til produkt</h2>

      <form id="product-form">
        <label for="name">Produktnavn</label>
        <input id="name" required maxlength="80">

        <label for="category">Kategori</label>
        <select id="category" required>
          <option value="Elektronikk">Elektronikk</option>
          <option value="Kontor">Kontor</option>
          <option value="Tilbehør">Tilbehør</option>
        </select>

        <label for="price">Pris (kr)</label>
        <input id="price" type="number" min="0"
               step="0.01" required>

        <label for="quantity">Antall på lager</label>
        <input id="quantity" type="number" min="0"
               step="1" required>

        <button type="submit">Legg til produkt</button>
      </form>
    </section>

    <section aria-labelledby="inventory-title">
      <h2 id="inventory-title">Produkter på lager</h2>

      <label for="search">Søk etter produkt</label>
      <input id="search" type="search"
             placeholder="Skriv et produktnavn...">

      <label for="filter">Filtrer etter kategori</label>
      <select id="filter">
        <option value="">Alle kategorier</option>
        <option value="Elektronikk">Elektronikk</option>
        <option value="Kontor">Kontor</option>
        <option value="Tilbehør">Tilbehør</option>
      </select>

      <p id="summary"></p>
      <p id="message" role="status" aria-live="polite"></p>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Produkt</th>
              <th>Kategori</th>
              <th>Pris</th>
              <th>Antall</th>
              <th>Status</th>
              <th>Handlinger</th>
            </tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
